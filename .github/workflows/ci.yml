name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs = require('node:fs'); const version = process.env.GITHUB_REF_NAME.slice(1); for (const file of ['package.json', 'package-lock.json']) { const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); if (pkg.version !== version || (file === 'package-lock.json' && pkg.packages[''].version !== version)) { console.error(file + ' version does not match v' + version); process.exitCode = 1; } }"
