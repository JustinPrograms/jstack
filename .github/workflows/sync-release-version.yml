name: Sync package version from release tag

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to sync
        required: true

permissions:
  contents: read

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update package version on main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_BOT: ${{ steps.release-token.outputs.app-slug }}[bot]
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          main_commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

          if [[ "$(node -p 'require("./package.json").version')" == "${RELEASE_TAG#v}" ]]; then
            echo "Package version already matches $RELEASE_TAG"
            exit 0
          fi

          npm version "${RELEASE_TAG#v}" --no-git-tag-version
          npm ci
          npm test

          git config user.name "$RELEASE_BOT"
          git config user.email "$RELEASE_BOT@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync package version to $RELEASE_TAG"
          git push origin HEAD:main
