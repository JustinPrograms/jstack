name: Sync package version from release tag

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update version on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          main_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tag must point to the current tip of main" >&2
            exit 1
          fi

          if [[ "$(node -p 'require("./package.json").version')" == "${RELEASE_TAG#v}" ]]; then
            echo "Package version already matches $RELEASE_TAG"
            exit 0
          fi

          npm version "${RELEASE_TAG#v}" --no-git-tag-version
          npm ci
          npm test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync package version to $RELEASE_TAG"
          git push origin HEAD:main
