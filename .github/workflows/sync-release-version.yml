name: Sync package version from release tag

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to sync
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Open version update PR
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          main_commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

          if [[ "$(node -p 'require("./package.json").version')" == "${RELEASE_TAG#v}" ]]; then
            echo "Package version already matches $RELEASE_TAG"
            exit 0
          fi

          branch="release/sync-$RELEASE_TAG"
          git switch -c "$branch"
          npm version "${RELEASE_TAG#v}" --no-git-tag-version
          npm ci
          npm test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync package version to $RELEASE_TAG"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: sync package version to $RELEASE_TAG" \
            --body "Update package.json and package-lock.json for the $RELEASE_TAG release. Tests passed in the release workflow."
